name: Notify IndexNow

"on":
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: indexnow-production
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for Vercel and notify IndexNow
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          INDEXNOW_SITE_URL: https://www.converto.tools
          WAIT_FOR_DEPLOYMENT: "true"
        run: node scripts/submit-indexnow.mjs
